note: >-
  Hyperstack sells consumption, not subscription tiers - there is no free/pro/enterprise
  ladder. What it publishes instead is a full public rate card for three purchase modes
  (on-demand, reserved, spot) plus storage and networking, all in USD and billed per
  minute. Enterprise-scale contracts are quoted directly. The plans below model each
  purchase mode as a tier; the per-GPU rates are recorded under prices[]. Every figure is
  transcribed verbatim from the public pricing page on 2026-08-26 and rates change.
