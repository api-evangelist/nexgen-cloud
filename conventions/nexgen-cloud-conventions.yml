auth:
  style: api-key-header
  header: api_key
  prefix: none
  format: opaque
  scope: >-
    Personal to the user account; one key works across every environment and region in
    the organization. There is no per-key scoping.
  expiry: none - keys do not expire automatically
  rotation: >-
    Manual and non-atomic. Generating a new key does NOT revoke the old one; the old key
    keeps working until explicitly deleted, so rotation is generate -> update clients ->
    delete old.
  oauth: false
  docs: https://docs.hyperstack.cloud/docs/api-reference/authentication
  detail: authentication/nexgen-cloud-authentication.yml
idempotency:
  supported: false
  header: null
  scope: null
  retention: null
  evidence: >-
    No Idempotency-Key (or any idempoten*) header, parameter or extension appears anywhere
    in either published OpenAPI document, and the API reference has no idempotency section.
  note: >-
    Real consequence, not a paperwork gap: Create_Vms, Create_Cluster, Create_volume and
    Initiate_Payment have no safe-retry key. A client that times out mid-write and retries
    can provision - and be billed for - a second GPU virtual machine. The partial
    mitigation the provider does offer is name uniqueness: several resources return 409
    already_exist on a duplicate name, and expose a name-availability probe
    (Check_VM_name_availability, Fetch_cluster_name_availability,
    Fetch_volume_name_availability, Fetch_environment_name_availability,
    Fetch_snapshot_name_availability). That is a collision check, not idempotency - it
    does not make a retry return the original result.
pagination:
  style: page-number
  page_param: page
  page_starts_at: 1
  page_size_params:
  - {name: pageSize, applies_to: 'Core resource endpoints (/core/virtual-machines, /core/volumes, /core/environments, ...)'}
  - {name: per_page, applies_to: Billing and Pricebook endpoints, and /core/images}
  - {name: page_size, applies_to: Object Storage endpoints (/object-storage/*)}
  response_shapes:
  - name: Shape 1
    applies_to: virtual machines, volumes, clusters, snapshots, marketplace deployments, most Core lists
    fields: [status, message, page, page_size, count, '<collection>']
    note: Pagination metadata precedes the data array.
  - name: Shape 2
    applies_to: environments, keypairs, firewalls, a handful of other Core endpoints
    fields: [status, message, '<collection>', page, page_size, count]
    note: >-
      Same fields as Shape 1 but metadata FOLLOWS the data array, and page/page_size come
      back null when omitted. Read fields by name, never by position.
  - name: Shape 3
    applies_to: all /object-storage/* endpoints
    fields: ['<collection>', 'meta.count', 'meta.current_page', 'meta.total_pages']
    note: No {status, message} envelope; different metadata field names.
  termination: >-
    Increment page until the returned array is shorter than the page size or empty. For
    Shape 3, stop when meta.current_page >= meta.total_pages.
  stability: >-
    Explicitly NOT stable across concurrent writes. The docs state a list paginates over
    live state at each request, so inserts/deletes between pages can duplicate or skip an
    item; fetch all pages first if a stable view is required.
  docs: https://docs.hyperstack.cloud/docs/api-reference/pagination
  note: >-
    Three page-size parameter names and three envelope shapes on one API is the largest
    ergonomic tax here - a generic client cannot page Hyperstack without a per-endpoint-group
    lookup table.
field_expansion:
  supported: false
sparse_fields:
  supported: false
metadata:
  supported: partial
  note: VMs carry a label (Add_VM_Label, PUT /core/virtual-machines/{vm_id}/label). No general key/value metadata bag.
request_tracing:
  request_id_header: false
  note: >-
    No X-Request-Id / traceparent correlation header is documented or declared. The
    `request_id` that appears in the spec is unrelated - it is the handle returned by
    Request_VM_Logs and consumed by Get_VM_Logs for asynchronous console-log retrieval.
