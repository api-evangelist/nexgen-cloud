  format: vendor-envelope
  rfc9457: false
  shape: '{status: boolean, message: string, error_reason: string}'
  variants: 3
  detail: errors/nexgen-cloud-problem-types.yml
rate_limit_signaling:
  response_headers: none documented
  exhaustion_status: 429
  retry_after: not documented
  detail: rate-limits/nexgen-cloud-rate-limits.yml
async_operations:
  supported: true
  pattern: 202 Accepted + poll
  note: >-
    Long-running work is accepted and polled rather than awaited. Request_VM_Logs returns
    202 with a request_id retrieved later via Get_VM_Logs; VM/cluster/volume creation
    returns immediately with a resource in a transitional state (CREATING, HIBERNATING,
    RESTORING) that the caller polls to ACTIVE.
dry_run_mode:
  supported: false
  note: >-
    No dry-run or validate-only parameter exists on any write operation. The closest
    rehearsal surfaces are the name-availability probes and
    Calculate_resource_billing_rate, which returns the hourly rate for a resource before
    it is provisioned - a cost rehearsal, not a request rehearsal.
reversibility:
  applicable: true
  grade: documented
  summary: >-
    Every state change on a Hyperstack VM has a documented inverse operation, and NONE of
    them carry a stated time window - which is why this grades `documented` and not
    `verified`. Destruction is the sharp edge: Delete_VM, Delete_volume, Delete_cluster
    and Delete_snapshot are all documented as permanent, with no undelete operation, no
    soft-delete state and no retention period anywhere in the docs or the contract. An
    agent that deletes a Hyperstack resource cannot get it back. The recoverable path is
    to snapshot first (Create_Snapshot_for_VM) and restore later (Restore_snapshot), but
    the provider states no retention guarantee on snapshots either.
  surfaces:
  - write: Hibernate_VM
    action: Hibernate a virtual machine
    reversal: Restore_VM_from_hibernation
    reversal_kind: restore
    window: not stated
    window_source: null
    docs: https://docs.hyperstack.cloud/docs/virtual-machines/hibernation
    note: >-
      State is preserved on persistent storage indefinitely while the root disk continues
      to be billed, so there is no expiry - but the provider never says so, and by default
      the attached public IP is RELEASED and a different one assigned on restore unless
      retain_ip=true was passed. The reversal is not identity-preserving.
  - write: Stop_VM
    action: Stop a running virtual machine
    reversal: Start_VM
    reversal_kind: restart
    window: not stated
    docs: https://docs.hyperstack.cloud/docs/billing/states-and-billing
    note: SHUTOFF continues to bill all resources - reversible, but not a cost saving.
  - write: Create_Snapshot_for_VM
    action: Snapshot a virtual machine
    reversal: Restore_snapshot
    reversal_kind: restore
    window: not stated
    docs: https://docs.hyperstack.cloud/docs/virtual-machines/snapshots
    note: >-
      Snapshots are capped at 100 GB, one at a time per VM, and unsupported for VMs in a
      Kubernetes cluster or deployed from a bootable volume. No stated retention period.
  - write: Attach_volumes_to_VM
    action: Attach block storage volumes
    reversal: Detach_volumes_from_VM
    reversal_kind: detach
    window: not stated
  - write: Attach_public_IP_to_VM
    action: Attach a floating public IP
    reversal: Detach_public_IP_from_VM
    reversal_kind: detach
    window: not stated
  - write: Attach_firewalls_to_VM
    action: Attach firewall rule sets to a VM
    reversal: Delete_firewall_rule_for_VM
    reversal_kind: remove
    window: not stated
  - write: Create_firewall_rule_for_VM
    action: Add a firewall rule to a VM
    reversal: Delete_firewall_rule_for_VM
    reversal_kind: remove
    window: not stated
  - write: Add_rule_to_firewall
    action: Add a rule to a firewall object
    reversal: Delete_rule_from_firewall
    reversal_kind: remove
    window: not stated
  - write: Create_Node_Group
    action: Add a Kubernetes node group
    reversal: Delete_Node_Group
    reversal_kind: delete
    window: not stated
  irreversible:
  - operation: Delete_VM
    note: '"Permanently deletes a virtual machine." No undelete, no retention window.'
  - operation: Delete_volume
    note: Permanent. Back up to a Shared Storage Volume first.
  - operation: Delete_cluster
    note: Permanent. The API MCP tool delete_cluster requires explicit confirmation.
  - operation: Delete_snapshot
    note: Permanent.
  - operation: Delete_environment
    note: Permanent.
  - operation: Delete_API_Key
    note: >-
      Permanent and immediate - this is the revocation path, and the only atomic step in
      key rotation.
  - operation: Initiate_Payment
    note: >-
      No refund, void or reverse operation exists in the contract. Payments are one-way
      from the API's point of view.
  ephemeral_data_warning: >-
    The docs warn that ephemeral disk data is lost on hibernate AND on delete; it must be
    copied to a Shared Storage Volume beforehand. There is no reversal for that loss.
