domain_standards:
- id: openai-chat-completions
  name: OpenAI Chat Completions API (de-facto inference interface standard)
  market: AI inference / model serving
  conforms: true
  confidence: high
  evidence: >-
    Declared BY THE CONTRACT, not by a marketing page. AI Studio's OpenAPI exposes
    POST /chat/completions (operationId chatCompletions), POST /images/generations,
    POST /images/edits and GET /models, and states "OpenAI-compatible" in six places
    including info.description ("OpenAI-compatible chat completions"), the Inference tag
    description, the /models description ("Returns all models available to the
    authenticated user in OpenAI-compatible format"), and two response schemas named
    OpenAIModelSchema and OpenAIModelsListResponseSchema whose `object` field is pinned to
    the OpenAI literal "list".
  spec_locations:
  - openapi/nexgen-cloud-ai-studio-openapi.json#/paths/~1chat~1completions/post
  - openapi/nexgen-cloud-ai-studio-openapi.json#/paths/~1models/get
  - openapi/nexgen-cloud-ai-studio-openapi.json#/paths/~1images~1generations/post
  - openapi/nexgen-cloud-ai-studio-openapi.json#/paths/~1images~1edits/post
  - openapi/nexgen-cloud-ai-studio-openapi.json#/components/schemas/OpenAIModelsListResponseSchema
  buyer_impact: >-
    A team already calling OpenAI, Anthropic-via-proxy, vLLM or any OpenAI-shaped gateway
    can point an existing client at https://console.hyperstack.cloud/ai/api/v1 and change
    a base URL and a key. No bespoke connector.
- id: s3-api
  name: Amazon S3 object storage API (de-facto standard)
  market: object storage
  conforms: true
  confidence: medium
  evidence: >-
    The Hyperstack OpenAPI describes its buckets and access-keys surface as "S3-compatible"
    object storage, and the object-storage endpoints manage S3 access-key credentials. The
    S3 data-plane itself is not described in the OpenAPI - only the control plane for
    provisioning buckets, regions and access keys - so compatibility of the data plane is
    a documented claim rather than a contract-level assertion, which is why this is medium
    and not high.
  spec_locations:
  - openapi/nexgen-cloud-hyperstack-openapi.json#/paths/~1object-storage~1access-keys
- id: kubernetes
