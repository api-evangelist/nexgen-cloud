- date: '2026-08-25'
  product: AI Studio
  title: Fine-tuning and Hyperstack-hosted models removed
  breaking: true
  highlights:
  - >-
    Fine-tuning and Hyperstack-hosted base models removed from BOTH the console and the
    API. LoRA adapter training and import, model deployment, model aliases, model
    evaluations, training metrics, logs, datasets and data synthesis all withdrawn with
    them.
  - >-
    Retired models: openai/gpt-oss-120b, mistralai/Mistral-Small-24B-Instruct-2501,
    meta-llama/Llama-3.3-70B-Instruct, meta-llama/Llama-3.1-8B-Instruct. Callers must
    pick a replacement from the Model Catalog and change the model name in their requests.
  - >-
    Unaffected: inference through the API, the Playground, Knowledge Bases, system prompts
    and conversations. Billing history for past usage remains available.
  note: >-
    The largest breaking change in the window and the clearest deprecation signal in this
    repo. AI Studio is now inference-only over third-party hosted models. Note that
    billing history endpoints for the withdrawn features are still declared in the
    Hyperstack OpenAPI (Get_fine-tuning_billing_history,
    Get_data_synthesis_billing_history, Get_model_evaluation_billing_history), so the
    contract still describes surfaces the product no longer sells.
- date: '2026-08-10'
  product: Hyperstack Core
  title: Operation failure reporting fix
  breaking: false
  highlights:
  - >-
    Operations such as creating a VM or deleting a volume now report a failure when they
    cannot complete. Previously an operation could intermittently stop without reporting
    an error, so the request appeared accepted but never completed.
