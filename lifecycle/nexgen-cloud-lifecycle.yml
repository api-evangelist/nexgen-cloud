generated: '2026-08-26'
method: searched
source: >-
  https://docs.hyperstack.cloud/docs/release-notes,
  https://docs.hyperstack.cloud/docs/support,
  https://status.hyperstack.cloud/,
  https://docs.hyperstack.cloud/docs/api-reference/introduction
  - cross-derived against openapi/nexgen-cloud-hyperstack-openapi.json
versioning:
  style: uri-path
  current: v1
  base_url: https://infrahub-api.nexgencloud.com/v1
  policy_published: false
  note: >-
    No written versioning policy exists. The API has carried /v1 since launch; the spec and
    SDKs move on an independent 1.54.x line that is not surfaced in the URI or in any
    response header. A consumer cannot tell which build of the contract they are talking to.
deprecation_policy:
  published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  advance_notice: not stated
  note: >-
    Hyperstack has no written deprecation policy and emits no RFC 8594 Sunset or
    Deprecation headers. Deprecation happens - the 2026-08-25 release note withdrew
    AI Studio fine-tuning, model deployment, evaluations, datasets and data synthesis from
    the API on the day it was announced, along with four named base models - but it is
    announced only as prose in the release notes, with no machine-readable signal, no
    notice period and no migration window. This is the single largest operational gap for
    an autonomous consumer: an agent has no runtime way to learn that an operation it
    depends on is going away.
  observed_deprecations:
  - date: '2026-08-25'
    scope: AI Studio
    withdrawn:
    - fine-tuning
    - LoRA adapter training and import
    - model deployment
    - model aliases
    - model evaluations
    - training metrics and logs
    - datasets
    - data synthesis
    - 'retired models: openai/gpt-oss-120b, mistralai/Mistral-Small-24B-Instruct-2501, meta-llama/Llama-3.3-70B-Instruct, meta-llama/Llama-3.1-8B-Instruct'
    notice: none - effective on announcement
    source: https://docs.hyperstack.cloud/docs/release-notes
deprecated_operations:
  count: 0
  note: >-
    Not one operation in either published OpenAPI carries `deprecated: true`. Verified
    across all 209 Hyperstack operations and all 33 AI Studio operations. This is not a
    clean bill of health - billing-history operations for the withdrawn AI Studio features
    (Get_fine-tuning_billing_history, Get_data_synthesis_billing_history,
    Get_model_evaluation_billing_history, Get_resource_fine-tuning_billing_history,
    Get_resource_model_evaluation_billing_history) are still declared as live in the
    contract the day after the features they bill for were removed.
