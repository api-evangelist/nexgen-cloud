cross_api_note: >-
  The two APIs share an API key and an organization but nothing else. There is no entity
  linking a Hyperstack virtual machine to an AI Studio conversation or model, and the two
  contracts declare no shared schema. The only join is billing: Hyperstack's billing
  history exposes serverless_inference, image_generation and (now-withdrawn) fine_tuning
  and model_evaluation history endpoints for AI Studio consumption.
