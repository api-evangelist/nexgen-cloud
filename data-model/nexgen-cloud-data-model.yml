note: >-
  Derived from $ref graph and id-reference fields in the published contracts. Identifiers
  are INTEGERS across the Hyperstack API, not prefixed strings - there is no id-prefix
  scheme to key an entity off, so an id alone does not tell an agent what it points at.
  The one scoping rule that matters operationally is documented in the error reference:
  IDs are REGION-SCOPED, so an ID from CANADA-1 is not visible to a key scoped to
  NORWAY-1, and the API answers 404 rather than 403.
id_scheme:
  type: integer
  prefixed: false
  region_scoped: true
  source: https://docs.hyperstack.cloud/docs/api-reference/errors
tenancy:
  root: Organization
  chain: Organization -> Environment (region-bound) -> resources
  note: >-
    Environment is the scoping container inside an organization and is bound to a region.
    Virtual machines, volumes, firewalls and keypairs all belong to an environment. An API
    key is personal to a user and works across every environment and region in the
    organization - the key is NOT the tenancy boundary, the environment is.
