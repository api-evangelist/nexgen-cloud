openapi: 3.2.0
info:
  title: Nexgen Cloud Firewalls API
  version: '1.0'
  description: 'Operations tagged Firewalls across 2 of this provider''s published API definitions: nexgen-cloud-hyperstack-openapi.json, nexgen-cloud-infrahub-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://infrahub-api.nexgencloud.com/v1
tags:
- name: Firewalls
  description: A firewall is a set of inbound and outbound rules scoped to an environment. Attach a firewall to one or more virtual machines or Kubernetes clusters to control which network traffic each resource can send and receive. Default rules block all inbound traffic, add explicit allow rules for SSH, HTTP, or any service you need to expose.
paths:
  /core/firewalls:
    get:
      tags:
      - Firewalls
      summary: List firewalls
      description: Retrieves a list of existing firewalls and their details, including the security rules they contain and information about the virtual machines to which they are attached. For more information about the firewalls features offered by Hyperstack, see [Security groups](https://docs.hyperstack.cloud/docs/network/firewalls).
      operationId: List_existing_firewalls
      parameters:
      - name: page
        in: query
        schema:
          type: integer
        description: Page number to retrieve.
      - name: pageSize
        in: query
        schema:
          type: integer
        description: Number of items to return per page.
      - name: search
        in: query
        schema:
          type: string
        description: Filter results by case-insensitive substring match against the resource name.
      - name: environment
        in: query
        description: Filter Environment ID or Name
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallsListResponse'
              example:
                status: true
                message: Getting firewalls success
                page: null
                page_size: null
                count: 2
                firewalls:
                - id: 3287
                  name: example-firewall
                  description: Example firewall
                  environment:
                    id: 8429
                    name: example-environment
                    region: NORWAY-1
                    features:
                      network_optimised: false
                      green_status: GREEN
                  status: SUCCESS
                  created_at: '2026-05-06T16:04:09Z'
                  rules:
                  - id: 1402
                    direction: egress
                    protocol: any
                    port_range_min: 1
                    port_range_max: 65535
                    ethertype: IPv6
                    remote_ip_prefix: 0.0.0.0/0
                    status: SUCCESS
                    created_at: '2026-05-06T16:04:09Z'
                  - id: 9876
                    direction: egress
                    protocol: any
                    port_range_min: 1
                    port_range_max: 65535
                    ethertype: IPv4
                    remote_ip_prefix: 0.0.0.0/0
                    status: SUCCESS
                    created_at: '2026-05-07T09:21:55Z'
                  - id: 2058
                    direction: ingress
                    protocol: tcp
                    port_range_min: 80
                    port_range_max: 80
                    ethertype: IPv4
                    remote_ip_prefix: 0.0.0.0/0
                    status: SUCCESS
                    created_at: '2026-05-07T11:47:30Z'
                  attachments: []
              examples:
                default:
                  summary: Successful response
                  value:
                    status: true
                    message: Getting firewalls success
                    page: null
                    page_size: null
                    count: 2
                    firewalls:
                    - id: 3287
                      name: example-firewall
                      description: Example firewall
                      environment:
                        id: 8429
                        name: example-environment
                        region: NORWAY-1
                        features:
                          network_optimised: false
                          green_status: GREEN
                      status: SUCCESS
                      created_at: '2026-05-06T16:04:09Z'
                      rules:
                      - id: 1402
                        direction: egress
                        protocol: any
                        port_range_min: 1
                        port_range_max: 65535
                        ethertype: IPv6
                        remote_ip_prefix: 0.0.0.0/0
                        status: SUCCESS
                        created_at: '2026-05-06T16:04:09Z'
                      - id: 9876
                        direction: egress
                        protocol: any
                        port_range_min: 1
                        port_range_max: 65535
                        ethertype: IPv4
                        remote_ip_prefix: 0.0.0.0/0
                        status: SUCCESS
                        created_at: '2026-05-07T09:21:55Z'
                      - id: 2058
                        direction: ingress
                        protocol: tcp
                        port_range_min: 80
                        port_range_max: 80
                        ethertype: IPv4
                        remote_ip_prefix: 0.0.0.0/0
                        status: SUCCESS
                        created_at: '2026-05-07T11:47:30Z'
                      attachments: []
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples: {}
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples: {}
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples: {}
      security:
      - apiKey: []
    post:
      tags:
      - Firewalls
      summary: Create firewall
      description: Creates a firewall to which firewall rules can be added. A firewall containing rules can be attached to one or more virtual machines to control inbound and outbound traffic. In the request body, include the firewall `name`, the ID of the `environment` it belongs to, and an optional `description`. Retrieve the ID of an environment by calling the [**list environments**](https://docs.hyperstack.cloud/docs/api-reference/list-environments) endpoint.
      operationId: Create_firewall
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFirewallPayload'
              example:
                name: example-firewall
                description: Example firewall
                environment_id: 8429
              properties: {}
            example:
              environment_id: 8429
              name: example-firewall
              description: Example firewall
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallResponse'
              example:
                status: true
                message: Firewall is scheduled for creation.
                firewall:
                  id: 8429
                  name: example-firewall
                  description: Example firewall
                  environment:
                    id: 4501
                    name: example-environment
                    region: NORWAY-1
                    features:
                      network_optimised: false
                      green_status: GREEN
                  status: CREATING
                  created_at: '2026-05-07T09:21:55Z'
              examples:
                default:
                  summary: Successful response
                  value:
                    status: true
                    message: Firewall is scheduled for creation.
                    firewall:
                      id: 8429
                      name: example-firewall
                      description: Example firewall
                      environment:
                        id: 4501
                        name: example-environment
                        region: NORWAY-1
                        features:
                          network_optimised: false
                          green_status: GREEN
                      status: CREATING
                      created_at: '2026-05-07T09:21:55Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples: {}
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples: {}
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples: {}
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples: {}
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples: {}
      security:
      - apiKey: []
    servers:
    - url: https://infrahub-api.nexgencloud.com/v1
  /core/firewalls/{firewall_id}/firewall-rules:
    post:
      tags:
      - Firewalls
      summary: Add firewall rule to firewall
      description: Creates a [**firewall rule**](https://docs.hyperstack.cloud/docs/network/firewalls) and adds it to an existing firewall. Include the firewall ID in the path, and provide the firewall rule configuration in the request body.
      operationId: Add_rule_to_firewall
      parameters:
      - name: firewall_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the firewall.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create_Firewall_Rule_Payload'
              example:
                direction: ingress
                protocol: tcp
                ethertype: IPv4
                remote_ip_prefix: 0.0.0.0/0
                port_range_min: 80
                port_range_max: 80
              properties: {}
            example:
              direction: ingress
              ethertype: IPv4
              protocol: tcp
              remote_ip_prefix: 0.0.0.0/0
              port_range_min: 80
              port_range_max: 80
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Firewall_Rule'
              example:
                status: true
                message: Firewall Rule created successfully
                firewall_rule:
                  id: 9876
                  direction: ingress
                  protocol: tcp
                  port_range_min: 80
                  port_range_max: 80
                  ethertype: IPv4
                  remote_ip_prefix: 0.0.0.0/0
                  status: pending
                  created_at: '2026-05-07T09:21:55Z'
              examples:
                default:
                  summary: Successful response
                  value:
                    status: true
                    message: Firewall Rule created successfully
                    firewall_rule:
                      id: 9876
                      direction: ingress
                      protocol: tcp
                      port_range_min: 80
                      port_range_max: 80
                      ethertype: IPv4
                      remote_ip_prefix: 0.0.0.0/0
                      status: pending
                      created_at: '2026-05-07T09:21:55Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples: {}
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples: {}
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples: {}
      security:
      - apiKey: []
    servers:
    - url: https://infrahub-api.nexgencloud.com/v1
  /core/firewalls/{firewall_id}/firewall-rules/{firewall_rule_id}:
    delete:
      tags:
      - Firewalls
      summary: Delete firewall rules from firewall
      description: Removes a firewall rule from a firewall. Provide the firewall ID and the firewall rule ID in the path.
      operationId: Delete_rule_from_firewall
      parameters:
      - name: firewall_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the firewall.
      - name: firewall_rule_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the firewall rule.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '404':
          description: Not Exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '500':
          description: Internal Server Error
          content: {}
      security:
      - apiKey: []
    servers:
    - url: https://infrahub-api.nexgencloud.com/v1
  /core/firewalls/{id}:
    get:
      tags:
      - Firewalls
      summary: Retrieve firewall details
      description: Retrieves details on an existing firewall, including the firewall rules it contains and information about the virtual machines to which it is attached.
      operationId: Get_firewall
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the firewall.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirewallDetailResponse'
              example:
                status: true
                message: Getting Firewall Details Successful.
                firewall:
                  id: 8429
                  name: example-firewall
                  description: Example firewall
                  environment:
                    id: 4501
                    name: example-environment
                    region: NORWAY-1
                    features:
                      network_optimised: false
                      green_status: GREEN
                  status: SUCCESS
                  created_at: '2026-05-07T09:21:55Z'
                  rules:
                  - id: 9876
                    direction: egress
                    protocol: any
                    port_range_min: 1
                    port_range_max: 65535
                    ethertype: IPv4
                    remote_ip_prefix: 0.0.0.0/0
                    status: SUCCESS
                    created_at: '2026-05-07T09:21:55Z'
                  - id: 2058
                    direction: egress
                    protocol: any
                    port_range_min: 1
                    port_range_max: 65535
                    ethertype: IPv6
                    remote_ip_prefix: 0.0.0.0/0
                    status: SUCCESS
                    created_at: '2026-05-07T11:47:30Z'
                  attachments: []
              examples:
                default:
                  summary: Successful response
                  value:
                    status: true
                    message: Getting Firewall Details Successful.
                    firewall:
                      id: 8429
                      name: example-firewall
                      description: Example firewall
                      environment:
                        id: 4501
                        name: example-environment
                        region: NORWAY-1
                        features:
                          network_optimised: false
                          green_status: GREEN
                      status: SUCCESS
                      created_at: '2026-05-07T09:21:55Z'
                      rules:
                      - id: 9876
                        direction: egress
                        protocol: any
                        port_range_min: 1
                        port_range_max: 65535
                        ethertype: IPv4
                        remote_ip_prefix: 0.0.0.0/0
                        status: SUCCESS
                        created_at: '2026-05-07T09:21:55Z'
                      - id: 2058
                        direction: egress
                        protocol: any
                        port_range_min: 1
                        port_range_max: 65535
                        ethertype: IPv6
                        remote_ip_prefix: 0.0.0.0/0
                        status: SUCCESS
                        created_at: '2026-05-07T11:47:30Z'
                      attachments: []
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples: {}
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
