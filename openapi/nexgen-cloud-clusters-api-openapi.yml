        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '500':
          description: Internal Server Error
          content: {}
      security:
      - accessToken: []
      - apiKey: []
    patch:
      tags:
      - Clusters
      summary: Update a node group in a cluster
      operationId: Update_Node_Group
      parameters:
      - name: cluster_id
        in: path
        required: true
