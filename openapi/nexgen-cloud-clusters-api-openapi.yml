      security:
      - accessToken: []
      - apiKey: []
      x-codegen-request-body-name: payload
  /core/clusters/{cluster_id}/nodes/delete:
    post:
      tags:
      - Clusters
      summary: Delete Multiple Cluster Nodes
      operationId: Delete_Cluster_Nodes
      parameters:
      - name: cluster_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteClusterNodesFields'
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseModel'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
