openapi: 3.2.0
info:
  title: Infrahub Clusters API
  version: '1.0'
  description: Cluster APIs
servers:
- url: https://infrahub-api.nexgencloud.com/v1
security:
- accessToken: []
- apiKey: []
tags:
- name: Clusters
  description: Cluster APIs
paths:
  /core/clusters:
    get:
      tags:
      - Clusters
      summary: List Clusters
      operationId: List_Clusters
      parameters:
      - name: page
        in: query
        description: Page number for pagination
        schema:
          type: integer
      - name: pageSize
        in: query
        description: Number of items per page
        schema:
          type: integer
      - name: environment
        in: query
        description: Environment Filter
        schema:
          type: string
      - name: search
        in: query
        description: Search query to filter cluster by name
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterListResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
        '500':
          description: Internal Server Error
          content: {}
      security:
      - accessToken: []
      - apiKey: []
    post:
      tags:
      - Clusters
      summary: Create Cluster
      operationId: Create_Cluster
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create_Cluster_Payload'
        required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResponse'
        '400':
          description: Bad Request
