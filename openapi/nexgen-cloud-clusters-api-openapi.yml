      description: Creates a Kubernetes cluster in Hyperstack with the specified custom configuration and features provided in the request body. To create a Kubernetes cluster, specify its configuration details by filling in the required fields in the request payload. These fields include the cluster name, node type, Kubernetes version, hardware configuration, and other relevant parameters. Once the payload is complete, send the request to the `/core/clusters` API using the **POST** method to deploy the cluster with the specified configuration. Creation usually takes around 15 minutes. Larger clusters, and creating several clusters at once, take longer. You can check the status of the cluster by calling the '[**Retrieve Cluster Details**](https://docs.hyperstack.cloud/docs/api-reference/getting-cluster-detail)' API. If your cluster is not in the `ACTIVE` state after 60 minutes, please remove the cluster and try again.
    servers:
    - url: https://infrahub-api.nexgencloud.com/v1
