          content: {}
      security:
      - accessToken: []
      - apiKey: []
    delete:
      tags:
      - Clusters
      summary: Delete a node group
      operationId: Delete_Node_Group
      parameters:
      - name: cluster_id
        in: path
        required: true
        schema:
          type: integer
      - name: node_group_id
        in: path
