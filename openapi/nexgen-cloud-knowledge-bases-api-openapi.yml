  /knowledge-bases/{kb_id}/status:
    get:
      operationId: getKnowledgeBaseStatus
      tags:
      - Knowledge Bases
      summary: Retrieve ingestion task status
      description: Returns the state of specific ingestion tasks for a knowledge base. Pass the task IDs returned by [**Ingest uploaded files**](https://docs.hyperstack.cloud/docs/ai-studio-api-reference/ingest-kb-files). To check a whole knowledge base instead, use [**Retrieve status for multiple knowledge bases**](https://docs.hyperstack.cloud/docs/ai-studio-api-reference/post-knowledge-bases-status).
      parameters:
      - name: kb_id
        in: path
        required: true
        description: Numeric ID of the knowledge base. Call the [**List knowledge bases**](https://docs.hyperstack.cloud/docs/ai-studio-api-reference/list-knowledge-bases) API to retrieve the `id` of an existing knowledge base.
        schema:
          type: integer
      - name: task_ids
        in: query
        required: true
        description: IDs of the ingestion tasks to check. At least one is required. Call the [**Ingest uploaded files**](https://docs.hyperstack.cloud/docs/ai-studio-api-reference/ingest-kb-files) API to retrieve the `ingestion_task_id` of a queued file.
        schema:
          type: array
          items:
            type: integer
      responses:
        '200':
          description: The requested ingestion tasks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: State of each requested task.
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: ID of the ingestion task.
                        status:
                          type: string
                          description: Current state of the task.
                          enum:
                          - pending
                          - processing
                          - completed
                          - failed
                          - cancelled
                        file_name:
                          type: string
                          description: File the task is indexing.
              example:
                data:
                - id: 24
                  status: completed
                  file_name: example-storage-notes.txt
        '400':
          description: No task IDs were supplied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Always `error` for a failed request.
                  code:
                    type: string
                    description: Machine-readable error code.
                  message:
                    type: string
                    description: Human-readable description of the error.
              example:
                status: error
                code: knowledge_base.task_ids_required
                message: At least one knowledge base task id is required.
        '401':
          description: Your API key is missing or invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Always `error` for a failed request.
                  code:
                    type: string
                    description: Machine-readable error code.
                  message:
                    type: string
                    description: Human-readable description of the error.
              example:
                status: error
                code: api_key.invalid
                message: Your API key is invalid.
        '404':
          description: No knowledge base with that ID exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Always `error` for a failed request.
                  code:
                    type: string
                    description: Machine-readable error code.
                  message:
                    type: string
                    description: Human-readable description of the error.
              example:
                status: error
                code: knowledge_base.not_found
                message: Knowledge base not found.
  /knowledge-bases/status:
    post:
      operationId: postKnowledgeBasesStatus
      tags:
      - Knowledge Bases
      summary: Retrieve status for multiple knowledge bases
      description: Returns the current state, counts, and ingestion summary for several knowledge bases in one call. Use this to refresh a list view without polling each knowledge base separately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - kb_ids
              properties:
                kb_ids:
                  type: array
                  items:
                    type: integer
                  description: IDs of the knowledge bases to check. Call the [**List knowledge bases**](https://docs.hyperstack.cloud/docs/ai-studio-api-reference/list-knowledge-bases) API to retrieve the `id` of an existing knowledge base.
                include_tasks_status:
                  type: boolean
                  default: false
                  description: Set to `true` to include per-task detail in `tasks`.
                task_ids:
                  type: array
                  items:
                    type: integer
                  description: Optional. Limits `tasks` to these ingestion tasks. Call the [**Ingest uploaded files**](https://docs.hyperstack.cloud/docs/ai-studio-api-reference/ingest-kb-files) API to retrieve the `ingestion_task_id` of a queued file.
            example:
              kb_ids:
              - 15
              - 16
              include_tasks_status: true
      responses:
        '200':
          description: Status for each requested knowledge base.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Status for each knowledge base that was found.
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Numeric ID of the knowledge base.
                        status:
                          type: string
                          description: Current state of the knowledge base.
                          enum:
                          - active
                          - processing
                          - failed
                          - deleting
                        file_count:
                          type: integer
                          description: Number of files in the knowledge base.
                        chunk_count:
                          type: integer
                          description: Total number of chunks indexed.
                        total_size:
                          type: integer
                          description: Combined size of all files, in bytes.
                        ingestion_summary:
                          type: object
                          description: Counts of files in each ingestion state.
                          properties:
                            pending:
                              type: integer
                              description: Number of files in the `pending` state.
                            processing:
                              type: integer
                              description: Number of files in the `processing` state.
                            completed:
                              type: integer
                              description: Number of files in the `completed` state.
                            failed:
                              type: integer
                              description: Number of files in the `failed` state.
                            cancelled:
                              type: integer
                              description: Number of files in the `cancelled` state.
                        tasks:
                          type: array
                          description: Per-task detail when `include_tasks_status` is `true`.
                          items:
                            type: object
                  not_found_kb_ids:
                    type: array
                    items:
                      type: integer
                    description: Requested IDs that do not exist.
              example:
                data:
                - id: 15
                  status: active
                  file_count: 2
                  chunk_count: 4
                  total_size: 1526
                  ingestion_summary:
                    pending: 0
                    processing: 0
                    completed: 2
                    failed: 0
                    cancelled: 0
                  tasks: []
                not_found_kb_ids: []
        '401':
          description: Your API key is missing or invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Always `error` for a failed request.
                  code:
                    type: string
                    description: Machine-readable error code.
                  message:
                    type: string
                    description: Human-readable description of the error.
              example:
                status: error
                code: api_key.invalid
                message: Your API key is invalid.
  /knowledge-bases/{kb_id}/cancel-ingestion:
    post:
      operationId: cancelKnowledgeBaseIngestion
      tags:
      - Knowledge Bases
      summary: Cancel knowledge base ingestion
      description: Stops the ingestion tasks that have not finished for a knowledge base. Chunks already written for those files are discarded, while files that finished indexing keep their chunks and stay searchable. Returns `404` when the knowledge base has no ingestion in progress.
      parameters:
      - name: kb_id
        in: path
        required: true
        description: Numeric ID of the knowledge base. Call the [**List knowledge bases**](https://docs.hyperstack.cloud/docs/ai-studio-api-reference/list-knowledge-bases) API to retrieve the `id` of an existing knowledge base.
        schema:
          type: integer
      responses:
        '200':
          description: Ingestion was cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Always `success` when ingestion is cancelled.
                  message:
                    type: string
                    description: Confirmation that ingestion was cancelled.
              example:
                status: success
                message: Knowledge base ingestion cancelled.
        '401':
          description: Your API key is missing or invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Always `error` for a failed request.
                  code:
                    type: string
                    description: Machine-readable error code.
                  message:
                    type: string
                    description: Human-readable description of the error.
              example:
                status: error
                code: api_key.invalid
                message: Your API key is invalid.
        '404':
          description: The knowledge base has no ingestion task in progress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Always `error` for a failed request.
                  code:
                    type: string
                    description: Machine-readable error code.
                  message:
                    type: string
                    description: Human-readable description of the error.
              example:
                status: error
                code: knowledge_base_ingestion_task.not_found
                message: Knowledge base ingestion task not found.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: api_key
      in: header
      description: 'API-key authentication. Pass your API key as the `api_key` header value (e.g., `api_key: YOUR_API_KEY`, no prefix). [Generate a key in the Hyperstack console](https://console.hyperstack.cloud/api-keys). The key is personal to your user account and works across every environment and region in your organization.'
