        example: '2026-05-01T00:00:00'
      - name: end_date
        in: query
        required: true
        description: Date should be formatted in YYYY-MM-DDTHH:MM:SS
        schema:
          type: string
        example: '2026-05-07T17:48:43'
      - name: search
        in: query
        description: Search by resource "Name" or "ID"
        schema:
          type: string
      - name: per_page
        in: query
        description: Number of items to return per page
        schema:
          type: integer
      - name: page
        in: query
        description: Page number of results to return.
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceLevelBucketBillingHistoryResponseModel'
              example:
                success: true
                message: Billing History for Bucket Retrieved Successfully.
                billing_history_bucket:
                  org_id: 8429
                  billing_history:
                  - attributes:
                      id: b18e3f72-4a5d-4c9e-8b7f-0a3c1d2e4f56
                      infrahub_id: 7613
                      resource_name: uimap-bucket-test
                      status: ACTIVE
                    metrics:
                      incurred_bill: 1.4799118041992184e-11
                      non_discounted_bill: 1.4799118041992184e-11
                      price_per_hour: 1.479911804199218e-10
                      non_discounted_price_per_hour: 1.479911804199218e-10
                      usage_time: 1680
                      size: 7.62939453125e-06
                  total_count: 1
                  pagination:
                    page: 1
                    per_page: 10
                    pages: 1
                    total_count: 1
              examples:
                default:
                  summary: Successful response
                  value:
                    success: true
                    message: Billing History for Bucket Retrieved Successfully.
                    billing_history_bucket:
                      org_id: 8429
                      billing_history:
                      - attributes:
                          id: b18e3f72-4a5d-4c9e-8b7f-0a3c1d2e4f56
                          infrahub_id: 7613
                          resource_name: uimap-bucket-test
                          status: ACTIVE
                        metrics:
                          incurred_bill: 1.4799118041992184e-11
                          non_discounted_bill: 1.4799118041992184e-11
                          price_per_hour: 1.479911804199218e-10
                          non_discounted_price_per_hour: 1.479911804199218e-10
                          usage_time: 1680
                          size: 7.62939453125e-06
                      total_count: 1
                      pagination:
                        page: 1
                        per_page: 10
                        pages: 1
                        total_count: 1
        '400':
          description: 'Bad Request


            Common cause: `error_reason: bad_request`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples:
                default:
                  summary: Bad Request
                  value:
                    status: false
                    message: The query parameter 'start_date' and 'end_date' must be in the format YYYY-MM-DDTHH:MM:SS
                    error_reason: bad_request
              example:
                status: false
                message: The query parameter 'start_date' and 'end_date' must be in the format YYYY-MM-DDTHH:MM:SS
                error_reason: bad_request
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples: {}
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples: {}
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples: {}
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples: {}
      security:
      - apiKey: []
    servers:
    - url: https://infrahub-api.nexgencloud.com/v1
