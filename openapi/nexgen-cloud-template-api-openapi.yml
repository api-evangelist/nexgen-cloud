              examples: {}
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseModel'
              examples: {}
        '500':
          description: Internal Server Error
          content:
            application/json:
              examples: {}
      security:
      - apiKey: []
    put:
      tags:
      - Template
      summary: Update template
      description: Updates the details of a template. Modify the template name, description and/or`is_public` status to change the public/private visibility of the template.
      operationId: Update_template
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the template.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Update_Template'
              example:
                name: example-tmpl
                description: Example resource (updated)
              properties: {}
            example:
              name: example-tmpl
              description: Example resource (updated)
        required: true
      responses:
        '200':
          description: Template updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
              example:
                status: true
                message: Template updated successfully
                template:
                  id: 2058
                  name: example-tmpl
                  description: Example resource (updated)
                  content: 'description: Example template

                    parameters: []

                    runcmd:

                    - echo hello

                    '
                  is_public: false
                  created_at: '2026-05-07T11:47:30Z'
              examples:
                default:
                  summary: Successful response
                  value:
                    status: true
                    message: Template updated successfully
                    template:
                      id: 2058
                      name: example-tmpl
                      description: Example resource (updated)
                      content: 'description: Example template

                        parameters: []

                        runcmd:

                        - echo hello

                        '
                      is_public: false
                      created_at: '2026-05-07T11:47:30Z'
        '400':
          description: Bad Request
          content:
