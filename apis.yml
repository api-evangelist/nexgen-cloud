  name: NexGen Cloud Virtual Machine API
  description: >-
    A virtual machine on Hyperstack is a single-tenant compute instance backed by dedicated GPU and CPU
    resources. Each VM runs in a region, attaches a root volume and optional data volumes, and is protected
    by an environment-scoped firewall. Most workflows follow this lifecycle: deploy → attach data volumes
    → run workload → snapshot → terminate. For long-running development VMs, hibernation is the cost-effective
    alternative to termination.
