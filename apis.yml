aid: nexgen-cloud
name: NexGen Cloud
description: 'NexGen Cloud Limited is a UK-headquartered AI cloud and GPU infrastructure
  provider. Its on-demand platform, Hyperstack, sells NVIDIA GPU and CPU virtual machines,
  managed Kubernetes clusters, block storage volumes, S3-compatible object storage
  and high-speed networking across three regions (CANADA-1, NORWAY-1, US-1), billed
  per minute. A second product, Hyperstack AI Studio, provides an OpenAI-compatible
  inference API over a catalog of third-party hosted text and image models, with playgrounds,
  system prompts, conversations and knowledge bases. The company also sells Secure
  Private Cloud, a single-tenant sovereign supercluster offering. Everything Hyperstack
  does in the console is available through a documented REST API at infrahub-api.nexgencloud.com,
  with official Python, Go, JavaScript and TypeScript SDKs, a Terraform provider, a
  Kubernetes CSI driver, a hosted read-only documentation MCP server and a self-hosted
  API MCP server.'
image: https://www.hyperstack.cloud/hubfs/hyperstack_2023/home/logo.svg
