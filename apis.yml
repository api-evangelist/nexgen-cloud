  resolution: >-
    Not a defect. repair-api-bases.py flags a disagreement because two different registrable
    hosts appear (infrahub-api.nexgencloud.com and console.hyperstack.cloud), but they belong
    to two DIFFERENT APIs and both are flagged ok. The provider's own docs and its
    /.well-known/api-catalog assign them explicitly: the Hyperstack API is served from
    https://infrahub-api.nexgencloud.com/v1 and the AI Studio API from
    https://console.hyperstack.cloud/ai/api/v1. Each is written to its matching apis[] entry
    and matches the servers[] block of the spec that entry links. No repair applied.
