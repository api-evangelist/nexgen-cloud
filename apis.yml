- aid: nexgen-cloud-ai-studio-api
  name: Hyperstack AI Studio API
  description: 'The AI Studio API is a REST API for inference on Hyperstack AI Studio:
    list the base-model catalog with pricing, run OpenAI-compatible chat completions,
    generate and edit images, manage conversations and message history, create reusable
    system prompts, and build knowledge bases from text and Markdown files for grounded
    retrieval-augmented answers. 33 operations. API-key authentication via the api_key
    header.'
  humanURL: https://docs.hyperstack.cloud/docs/api-reference/section-ai-studio/
  baseURL: https://console.hyperstack.cloud/ai/api/v1
