apis:
- aid: nexgen-cloud-hyperstack-api
  name: Hyperstack API
  description: 'The Hyperstack API is a REST API for deploying and managing GPU infrastructure
    on the Hyperstack cloud: provision virtual machines, manage snapshots and images,
    attach block-storage volumes, manage S3-compatible object-storage buckets and access
    keys, configure firewalls and floating IPs, provision Kubernetes clusters and node
    groups, administer organizations, RBAC roles and API keys, and read pricing, credit
    and billing data programmatically. 209 documented operations across 46 tags. API-key
    authentication via the api_key header.'
  humanURL: https://docs.hyperstack.cloud/docs/api-reference/introduction
  baseURL: https://infrahub-api.nexgencloud.com/v1
